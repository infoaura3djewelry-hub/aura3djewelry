<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA 3D JEWELRY — Richiesta Progetto CAD</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root { --bg:#111215; --card:rgba(18,19,28,0.45); --gold:#E5C483; --gold-dim:#C5A86B; --text:#F4F4F6; --border:rgba(229,196,131,0.25); }
        body { background-color:var(--bg); color:var(--text); font-family:'Montserrat',sans-serif; letter-spacing:0.5px; overflow-x:hidden; }
        .media-bg { position:fixed; top:0; left:0; width:100%; height:100vh; z-index:-2; overflow:hidden; background:linear-gradient(rgba(17,18,21,0.35),rgba(17,18,21,0.55)), url('https://picsum.photos') no-repeat center center fixed; background-size:cover; }
        .media-bg video { width:100%; height:100%; object-fit:cover; }
        .media-overlay { position:fixed; top:0; left:0; width:100%; height:100vh; background:linear-gradient(rgba(17,18,21,0.35),rgba(17,18,21,0.55)); z-index:-1; }
        header { display:flex; justify-content:space-between; align-items:center; padding:10px 5%; border-bottom:1px solid var(--border); background:rgba(17,18,21,0.8); backdrop-filter:blur(8px); }
        .logo-img { display:flex; align-items:center; text-decoration:none; }
        .logo-img img { width:220px; height:auto; object-fit:contain; }
        .container { max-width:750px; margin:40px auto; padding:0 5%; }
        h1 { font-family:'Playfair Display',serif; font-size:28px; margin-bottom:5px; }
        .sub { color:#fff; font-size:13px; margin-bottom:30px; font-weight:400; }
        .panel { background:var(--card); padding:35px; border:1px solid var(--border); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); box-shadow:0 20px 50px rgba(0,0,0,0.5); }
        .form-group { margin-bottom:20px; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
        label { display:block; font-size:11px; text-transform:uppercase; color:var(--gold); letter-spacing:1px; margin-bottom:8px; font-weight:600; }
        input, select, textarea { width:100%; background:#2A2C35; border:1px solid #4A4D5A; padding:12px; color:#fff; font-family:inherit; outline:none; font-size:13px; font-weight:500; }
        input:focus, select:focus, textarea:focus { border-color:var(--gold); background:#353842; box-shadow:0 0 8px rgba(229,196,131,0.3); }
        textarea { resize:vertical; height:100px; }
        .upload-box { border:2px dashed var(--gold); padding:20px; text-align:center; cursor:pointer; background:rgba(42,44,53,0.4); }
        .btn-submit { display:block; width:100%; background:var(--gold); color:#111215; text-align:center; border:none; padding:15px; font-size:12px; text-transform:uppercase; letter-spacing:1px; font-weight:600; cursor:pointer; margin-top:10px; }
        .btn-submit:hover { background:var(--gold-dim); }
        @media (max-width:600px) { .form-row { grid-template-columns:1fr; gap:20px; } }
    </style>
</head>
<body>
    <div class="media-bg">
        <video autoplay loop muted playsinline><source src="https://mixkit.co" type="video/mp4"><source src="./sfondo.mp4" type="video/mp4"></video>
    </div>
    <div class="media-overlay"></div>
    <header><a href="./index.html" class="logo-img"><img src="./logo aura.png" alt="AURA 3D JEWELRY"></a></header>
    <div class="container">
        <h1>Studio di Progettazione</h1>
        <p class="sub">Richiedi un preventivo di modellazione CAD calcolando spessori, ritiri e gemme.</p>
       <!-- NUOVO MODULO ATTIVO CON LA TUA CHIAVE REALZZA -->
<form class="panel" action="https://api.web3forms.com/submit" method="POST" enctype="multipart/form-data">
    <input type="hidden" name="access_key" value="34201526-205e-4555-8483-06c149aa382d">
    <input type="hidden" name="subject" value="AURA 3D JEWELRY: Nuova richiesta preventivo CAD">

            <div class="form-row">
                <div class="form-group"><label>Nome / Azienda *</label><input type="text" required placeholder="Es. Oreficeria Rossi"></div>
                <div class="form-group"><label>Email *</label><input type="email" required placeholder="rossi@esempio.com"></div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Tipo Gioiello</label>
                    <select><option>Anello / Solitario</option><option>Orecchini</option><option>Ciondolo / Bracciale</option></select>
                </div>
                <div class="form-group"><label>Misura / Quote</label><input type="text" placeholder="Es. Misura IT 14"></div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Metallo Finale</label>
                    <select><option>Oro 18kt</option><option>Platino</option><option>Argento 925</option></select>
                </div>
                <div class="form-group">
                    <label>Gemme</label>
                    <select><option>Nessuna gemma</option><option>Incassatura Griffe / Pavé</option><option>Castone Battuto</option></select>
                </div>
            </div>
            <div class="form-group">
                <label>Schizzo o Immagine</label>
                <div class="upload-box" onclick="document.getElementById('img-input').click()">
                    <!-- INTEGRAZIONE CAPTURE PER ATTIVARE LA FOTOCAMERA DA APP SMARTPHONE -->
                    <input type="file" id="img-input" accept="image/*" capture="environment" onchange="document.getElementById('img-text').innerText = this.files.name">
                    <p id="img-text">Seleziona o scatta una foto</p>
                </div>
            </div>
            <div class="form-group"><label>Dettagli Progetto</label><textarea placeholder="Descrivi tolleranze, diametri delle pietre o specifiche utili..."></textarea></div>
            <button type="submit" class="btn-submit">Invia al Reparto CAD</button>
        </form>
    </div>
</body>
</html>
