<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA 3D — CAD Design</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root { --bg:#111215; --card:rgba(18,19,28,0.45); --gold:#E5C483; --text:#F4F4F6; --border:rgba(229,196,131,0.25); }
        body { background-color:var(--bg); color:var(--text); font-family:'Montserrat',sans-serif; letter-spacing:0.5px; overflow-x:hidden; }
        .media-bg { position:fixed; top:0; left:0; width:100%; height:100vh; z-index:-2; overflow:hidden; background:linear-gradient(rgba(17,18,21,0.35),rgba(17,18,21,0.55)), url('https://picsum.photos') no-repeat center center fixed; background-size:cover; }
        .media-bg video { width:100%; height:100%; object-fit:cover; }
        .media-overlay { position:fixed; top:0; left:0; width:100%; height:100vh; background:linear-gradient(rgba(17,18,21,0.35),rgba(17,18,21,0.55)); z-index:-1; }
        header { padding:20px 5%; border-bottom:1px solid var(--border); background:rgba(17,18,21,0.8); backdrop-filter:blur(8px); }
        .logo { font-family:'Playfair Display',serif; font-size:24px; letter-spacing:3px; text-decoration:none; color:#fff; }
        .logo span { color:var(--gold); font-size:11px; vertical-align:super; }
        .container { max-width:750px; margin:40px auto; padding:0 5%; }
        h1 { font-family:'Playfair Display',serif; font-size:28px; margin-bottom:5px; }
        .sub { color:#fff; font-size:13px; margin-bottom:30px; font-weight:400; }
        .panel { background:var(--card); padding:35px; border:1px solid var(--border); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); box-shadow:0 20px 50px rgba(0,0,0,0.5); }
        .form-group { margin-bottom:20px; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
        label { display:block; font-size:11px; text-transform:uppercase; color:var(--gold); letter-spacing:1px; margin-bottom:8px; font-weight:600; }
        input, select, textarea { width:100%; background:#2A2C35; border:1px solid #4A4D5A; padding:12px; color:#fff; font-family:inherit; outline:none; font-size:13px; font-weight:500; }
        input:focus, select:focus, textarea:focus { border-color:var(--gold); background:#353842; }
        textarea { resize:vertical; height:100px; }
        .upload-box { border:2px dashed var(--gold); padding:20px; text-align:center; cursor:pointer; background:rgba(42,44,53,0.4); }
        .btn-submit { display:block; width:100%; background:var(--gold); color:#111215; text-align:center; border:none; padding:15px; font-size:12px; text-transform:uppercase; letter-spacing:1px; font-weight:600; cursor:pointer; margin-top:10px; }
        @media (max-width:600px) { .form-row { grid-template-columns:1fr; gap:20px; } }
    </style>
</head>
<body>
    <div class="media-bg">
        <video autoplay loop muted playsinline>
            <source src="https://mixkit.co" type="video/mp4">
            <source src="../sfondo.mp4" type="video/mp4">
        </video>
    </div>
    <div class="media-overlay"></div>
    <header><a href="./index.html" class="logo">AURA<span>3D</span></a></header>
    <div class="container">
        <h1>CAD Design Bureau</h1>
        <p class="sub">Request a jewelry 3D modeling quote factoring in clearances, shrinkage, and gem settings.</p>
        
        <form class="panel" onsubmit="event.preventDefault(); alert('Specifications successfully submitted!');">
            <div class="form-row">
                <div class="form-group"><label>Name / Company *</label><input type="text" required placeholder="Ex. Rossi Jewelry"></div>
                <div class="form-group"><label>Email *</label><input type="email" required placeholder="rossi@example.com"></div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Jewelry Type</label>
                    <select><option>Ring / Solitaire</option><option>Earrings</option><option>Pendant / Bracelet</option></select>
                </div>
                <div class="form-group"><label>Size / Measurements</label><input type="text" placeholder="Ex. US Size 7 / IT 14"></div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Final Metal</label>
                    <select><option>18kt Gold</option><option>Platinum</option><option>Sterling Silver</option></select>
                </div>
                <div class="form-group">
                    <label>Stone Setting</label>
                    <select><option>No stones (Sculpture)</option><option>Prong / Pave Setting</option><option>Bezel / Flush Setting</option></select>
                </div>
            </div>
            <div class="form-group">
                <label>Sketch or Reference Image</label>
                <div class="upload-box" onclick="document.getElementById('img-input').click()">
                    <input type="file" id="img-input" accept="image/*" onchange="document.getElementById('img-text').innerText = this.files.name">
                    <p id="img-text">Select or drag a photo</p>
                </div>
            </div>
            <div class="form-group"><label>Project Notes</label><textarea placeholder="Describe wall clearances, stone diameters, or helpful specifications..."></textarea></div>
            <button type="submit" class="btn-submit">Submit to CAD Department</button>
        </form>
    </div>
</body>
</html>
